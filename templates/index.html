<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Chistes</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-6">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">😄 Generador de Chistes 😄</h1>
        
        <div id="joke-container" class="mb-8">
            {% if joke %}
                {% if joke.type == 'single' %}
                    <p class="text-xl text-gray-700 text-center p-4 bg-gray-100 rounded-lg">{{ joke.joke }}</p>
                {% else %}
                    <div class="space-y-4">
                        <p class="text-xl text-gray-700 text-center p-4 bg-gray-100 rounded-lg">{{ joke.setup }}</p>
                        <p class="text-xl text-gray-700 text-center p-4 bg-gray-100 rounded-lg">{{ joke.delivery }}</p>
                    </div>
                {% endif %}
            {% else %}
                <p class="text-xl text-gray-700 text-center">¡Ups! No pudimos cargar un chiste.</p>
            {% endif %}
        </div>

        <div class="text-center">
            <button onclick="window.location.reload()" 
                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full 
                           transform transition hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50">
                ¡Otro chiste! 🎲
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
